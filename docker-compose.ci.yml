version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: gateway-mongodb-ci
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gateway-redis-ci
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: gateway-server-ci
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=test
      - PORT=3000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongodb:27017/gateway_test
      - REDIS_URL=redis://redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - PYTHON_ROUTER_URL=http://python-router:8000
      - PYTHON_ROUTER_ENABLED=true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: gateway-dashboard-ci
    ports:
      - "5173:80"
    depends_on:
      - server

  python-router:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    container_name: gateway-python-router-ci
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: gateway-nginx-ci
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.ci.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - dashboard