apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.NODE_ENV }}
  PORT: {{ .Values.config.PORT }}
  HOST: {{ .Values.config.HOST }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL }}
  LOG_FORMAT: {{ .Values.config.LOG_FORMAT }}
  DASHBOARD_URL: {{ .Values.config.DASHBOARD_URL }}
  PYTHON_ROUTER_URL: {{ .Values.config.PYTHON_ROUTER_URL }}
  PYTHON_ROUTER_ENABLED: {{ .Values.config.PYTHON_ROUTER_ENABLED }}
  OAUTH_REDIRECT_URI: {{ .Values.config.OAUTH_REDIRECT_URI }}