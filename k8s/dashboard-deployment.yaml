apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-dashboard
  namespace: gateway
  labels:
    app: gateway-dashboard
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-dashboard
  template:
    metadata:
      labels:
        app: gateway-dashboard
        component: frontend
    spec:
      serviceAccountName: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: dashboard
          image: ghcr.io/your-org/gateway/dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5