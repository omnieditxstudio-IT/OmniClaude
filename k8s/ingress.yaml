apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: gateway
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - gateway.example.com
        - api.gateway.example.com
      secretName: gateway-tls
  rules:
    - host: gateway.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-dashboard
                port:
                  number: 80
    - host: api.gateway.example.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: gateway-server
                port:
                  number: 3000
          - path: /v1/
            pathType: Prefix
            backend:
              service:
                name: gateway-server
                port:
                  number: 3000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: gateway-server
                port:
                  number: 3000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: gateway-server
                port:
                  number: 3000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: gateway-server
                port:
                  number: 3000