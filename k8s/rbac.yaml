apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: gateway
  labels:
    app: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway
  namespace: gateway
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway
  namespace: gateway
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: gateway
roleRef:
  kind: Role
  name: gateway
  apiGroup: rbac.authorization.k8s.io